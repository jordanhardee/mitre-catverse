name: Refresh MITRE knowledge bases
on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/sync.py"
      - "requirements.txt"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/sync.py
      - name: Commit generated self-hosted snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh local MITRE ATT&CK and ATLAS snapshots"
            git push
          fi
